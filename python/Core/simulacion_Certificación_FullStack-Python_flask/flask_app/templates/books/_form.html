{# Formulario compartido por "nuevo" y "editar". Variables: action, genres, values (dict), submit_label #}
<form action="{{ action }}" method="post" novalidate>
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label" for="title">Título:</label>
        <div class="col-sm-9"><input type="text" class="form-control" id="title" name="title" value="{{ values.title or '' }}"></div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label" for="author">Autor:</label>
        <div class="col-sm-9"><input type="text" class="form-control" id="author" name="author" value="{{ values.author or '' }}"></div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label" for="genre">Género:</label>
        <div class="col-sm-9">
            <select class="form-select" id="genre" name="genre">
                <option value="">Selecciona un género</option>
                {% for g in genres %}
                <option value="{{ g }}" {% if values.genre == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label" for="publication_date">Fecha de publicación:</label>
        <div class="col-sm-9"><input type="date" class="form-control" id="publication_date" name="publication_date" value="{{ values.publication_date or '' }}"></div>
    </div>
    <div class="row mb-3">
        <label class="col-sm-3 col-form-label" for="description">Descripción:</label>
        <div class="col-sm-9"><textarea class="form-control" id="description" name="description" rows="5">{{ values.description or '' }}</textarea></div>
    </div>
    <div class="d-flex gap-3 align-items-center">
        <button type="submit" class="btn btn-dark px-4">{{ submit_label }}</button>
        <a href="/libros">Cancelar</a>
    </div>
</form>
